services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-subscriptions}
      POSTGRES_USER: ${POSTGRES_USER:-subscriptions_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      API_KEY: ${API_KEY:?API_KEY is required}
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-subscriptions_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-subscriptions}?sslmode=disable}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
